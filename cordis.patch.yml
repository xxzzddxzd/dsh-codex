# Optional subscription routes over the base composition. The profile keeps
# its own default model until the user signs in and chooses a Provider model.

- id: web
  config:
    searchProvider: provider-codex

- insert:
    - id: llm-openai-codex
      name: dsh-codex
    # Optional terminal front-door adapter. It stays dormant on Web because
    # tuiWorkspaces is absent, and contributes /codex when dsh-tui is mounted.
    - id: openai-codex-tui
      name: dsh-codex/tui
      inject: [openAICodex]
